name: CI

# Every push to main and every pull request runs the unit suite, so broken
# commits never land unnoticed and external contributors get fast feedback.
# Read-only job: contents: read is the minimum the token needs to clone this
# private repo, and it grants nothing writable.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run the unit test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the locally validated Python; bump deliberately.
          python-version: "3.14.3"

      - name: Install the runtime dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run the unit test suite
        run: python -m unittest tests.py --verbose
