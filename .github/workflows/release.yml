name: Release

# Cutting a release is one tagged run: test the project, build the pinned
# Windows bundle, smoke-test it, assemble the reviewable assets, and attach
# them to a draft GitHub Release. Publishing stays a manual review step.
# A failed run (flaky smoke test, transient FFmpeg fetch) can also be re-run
# manually via workflow_dispatch, passing the same tag as the input; an empty
# input falls back to the triggering ref. The tag pattern pre-filters to
# digit-led tags (vfoo never runs); the dotted v<major>.<minor>.<patch> form
# is enforced by package_release.py.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (v<major>.<minor>.<patch>); empty uses the triggering ref"
        required: false
        default: ""

# Deny everything at the workflow level; the release job grants itself only
# what gh release create needs.
permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build and draft the Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # On a tag push this is the tag; on workflow_dispatch it is the input
      # (GITHUB_REF_NAME would name the branch the run was dispatched from).
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stamp the executable version from the tag
        # Rewrites version_info.txt in the working tree so the exe metadata
        # matches the tag, the ZIP name, and the generated release notes.
        # Also fails the run fast if the tag is not v<major>.<minor>.<patch>.
        run: python set_version.py --tag $env:RELEASE_TAG

      - name: Set up the pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the locally validated Python; bump deliberately.
          python-version: "3.14.3"

      - name: Install the pinned release dependencies
        # Hash-pinned lockfile: the install fails if any downloaded wheel or
        # sdist does not match the sha256 recorded in requirements-release.txt.
        run: python -m pip install --require-hashes --requirement requirements-release.txt

      - name: Run the unit test suite
        run: python -m unittest tests.py --verbose

      - name: Build the portable bundle
        # build-release.ps1 installs the pinned requirements, fetches and
        # checksum-verifies the pinned FFmpeg build, runs PyInstaller, and
        # zips the bundle.
        run: powershell -ExecutionPolicy Bypass -File build-release.ps1

      - name: Verify the bundle was built
        run: |
          if (-not (Test-Path "dist/ctrl-shift-mp3/ctrl-shift-mp3.exe")) {
            throw "Expected dist/ctrl-shift-mp3/ctrl-shift-mp3.exe after the build."
          }

      - name: Smoke-test the packaged bundle
        # Launches the built executable from outside the checkout and fails
        # the release if the frontend, static assets, or bundled FFmpeg do
        # not come up.
        run: python smoke_test.py --verbose

      - name: Assemble the release assets
        run: python package_release.py --tag $env:RELEASE_TAG

      - name: Create the draft release
        # package_release.py wrote dist/release-assets.txt: the versioned ZIP,
        # its checksum, and NOTICES.txt, one path per line.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-Content dist/release-assets.txt
          gh release create "$env:RELEASE_TAG" $assets --draft --title "ctrl+shift+mp3 $env:RELEASE_TAG" --notes-file dist/release-notes.md
