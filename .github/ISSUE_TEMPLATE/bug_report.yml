name: Bug report
description: Report something that is broken or behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details
        below — the more precise the reproduction steps, the faster the fix.
        Security problems should not be reported here; see
        [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        The playlist link type (Spotify or YouTube) and the exact actions from
        a fresh app start, so the failure can be replayed.
      placeholder: |
        1. Paste a YouTube playlist link "..."
        2. Click Scan
        3. See error
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running the app?
      options:
        - Windows release (ZIP download)
        - From source
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version, or the commit hash if running from source.
      placeholder: v1.0.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or console output
      description: From the console window or `~/.playlist_downloader.log`. Redact anything private.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, proxy/antivirus details, or related issues.
